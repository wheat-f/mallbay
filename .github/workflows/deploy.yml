name: Build & Deploy

# ── 触发规则 ────────────────────────────────────────────────────
# PR 创建/更新（新 commit）→ 构建 api + web(test) → 部署测试环境
# push main（PR 合并）     → 构建 api + web(prod) → 部署生产环境
# 单纯 push 功能分支       → 不触发任何部署
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_REGISTRY:  ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_TAG:     ${{ github.sha }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: 构建 API 镜像（PR 和 main push 都会执行，无环境变量差异）
  # ──────────────────────────────────────────────────────────────
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute safe branch tag
        id: tag
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "branch=${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push mallbay-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/mallbay-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/mallbay-api:${{ steps.tag.outputs.branch }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 2: 构建 Web 镜像（测试环境）
  # NEXT_PUBLIC_API_URL 编译进镜像，需从 test environment secrets 读取
  # ──────────────────────────────────────────────────────────────
  build-web-test:
    name: Build & Push Web (Test)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute safe branch tag
        id: tag
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "branch=${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push mallbay-web (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/mallbay-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/mallbay-web:${{ steps.tag.outputs.branch }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 3: 构建 Web 镜像（生产环境）
  # NEXT_PUBLIC_API_URL 编译进镜像，需从 production environment secrets 读取
  # ──────────────────────────────────────────────────────────────
  build-web-prod:
    name: Build & Push Web (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute safe branch tag
        id: tag
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "branch=${BRANCH//\//-}" >> $GITHUB_OUTPUT

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push mallbay-web (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/mallbay-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/mallbay-web:${{ steps.tag.outputs.branch }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 4: 部署到测试环境（仅 PR 事件触发）
  # ──────────────────────────────────────────────────────────────
  deploy-test:
    name: Deploy → Test
    runs-on: ubuntu-latest
    needs: [build-api, build-web-test]
    if: github.event_name == 'pull_request'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure target directory exists on Test ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key:      ${{ secrets.ECS_SSH_KEY }}
          script:   mkdir -p /opt/mallbay

      - name: Sync compose file to Test ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key:      ${{ secrets.ECS_SSH_KEY }}
          source:   docker-compose.prod.yml
          target:   /opt/mallbay

      - name: Deploy to Test via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key:      ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/mallbay

            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate api web
            docker system prune -af

            echo "✅ Test deployed — ${{ github.sha }}"

  # ──────────────────────────────────────────────────────────────
  # Job 5: 部署到生产环境（仅 push main 触发，即 PR 合并后）
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build-api, build-web-prod]
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure target directory exists on Production ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key:      ${{ secrets.ECS_SSH_KEY }}
          script:   mkdir -p /opt/mallbay

      - name: Sync compose file to Production ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key:      ${{ secrets.ECS_SSH_KEY }}
          source:   docker-compose.prod.yml
          target:   /opt/mallbay

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key:      ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/mallbay

            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env

            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate api web
            docker system prune -af

            echo "✅ Production deployed — ${{ github.sha }}"
