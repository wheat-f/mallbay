services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-mallbay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ──────────────────────────────────────────────────
  api:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/mallbay-api:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - oss-data:/app/apps/api/.local/oss
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      NODE_ENV:               production
      PORT:                   3001
      DATABASE_URL:           ${DATABASE_URL}
      REDIS_URL:              ${REDIS_URL}
      JWT_ACCESS_SECRET:      ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN:  ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      METRICS_TOKEN:          ${METRICS_TOKEN:?METRICS_TOKEN is required}
      AUTH_CREDENTIAL_ENCRYPTION_ENABLED: ${AUTH_CREDENTIAL_ENCRYPTION_ENABLED:-true}
      AUTH_COOKIE_SECURE:     ${AUTH_COOKIE_SECURE:-true}
      WEB_ORIGIN:             ${WEB_ORIGIN}
      OSS_REGION:             ${OSS_REGION}
      OSS_ACCESS_KEY_ID:      ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET:  ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET:             ${OSS_BUCKET}
      OSS_PROVIDER:           ${OSS_PROVIDER:-oss}
      OSS_LOCAL_DIR:          ${OSS_LOCAL_DIR:-.local/oss}
      OSS_PUBLIC_BASE_URL:    ${OSS_PUBLIC_BASE_URL:-http://localhost:3001/local-oss}
      OSS_CDN_HOST:           ${OSS_CDN_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Web ─────────────────────────────────────────────────
  web:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/mallbay-web:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      NODE_ENV:              production
      NEXT_PUBLIC_API_URL:   ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_AUTH_CREDENTIAL_ENCRYPTION_ENABLED: ${NEXT_PUBLIC_AUTH_CREDENTIAL_ENCRYPTION_ENABLED:-true}
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  oss-data:
